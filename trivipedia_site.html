<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivipedia</title>
    <div id="corners-wrapper"></div>
        <label class="switch">
            <input type="checkbox" id="dark-mode-toggle">
            <span class="slider"></span>
        </label>
    <button id="random-btn">Random Fact</button>
    </div>
    

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="main-title">Welcome to Trivipedia</h1>
    </header>
    <main>


        <div id="search-container">
            <select id="datedropdown"></select>

            <div id="search-wrapper">
                <input type="text" id="search-box" placeholder="Search for trivia...">
                <ul id="search-suggestions" class="autocomplete-list"></ul>

                <button id="search-btn">
                    <svg fill="#000000" width="800px" height="800px" viewBox="0 -0.24 28.423 28.423" id="_02_-_Search_Button" data-name="02 - Search Button" xmlns="http://www.w3.org/2000/svg">
                    <path id="Path_215" data-name="Path 215" d="M14.953,2.547A12.643,12.643,0,1,0,27.6,15.19,12.649,12.649,0,0,0,14.953,2.547Zm0,2A10.643,10.643,0,1,1,4.31,15.19,10.648,10.648,0,0,1,14.953,4.547Z" transform="translate(-2.31 -2.547)" fill-rule="evenodd"/>
                    <path id="Path_216" data-name="Path 216" d="M30.441,28.789l-6.276-6.276a1,1,0,1,0-1.414,1.414L29.027,30.2a1,1,0,1,0,1.414-1.414Z" transform="translate(-2.31 -2.547)" fill-rule="evenodd"/>
                    </svg>
                </button>
            </div>

            
        </div>


        <section>
            <div id="sections-grid">
                <div class="section-tile" id="itn-tile">
                    <h3>In The News</h3>
                    <ul></ul>
                </div>
                <div class="section-tile" id="tfa-tile">
                    <h3>Today’s Featured Article</h3>
                    <ul></ul>
                </div>
                <div class="section-tile" id="dyk-tile">
                    <h3>Did You Know?</h3>
                    <ul></ul>
                </div>
                <div class="section-tile" id="otd-tile">
                    <h3>On This Day</h3>
                    <ul></ul>
                </div>
            </div>
            <pre id = "data-dump"></pre>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Trivipedia</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
